<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="t"><title id="t">13 — Beyond the code</title><style>@font-face{font-family:BG;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:BG;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:BG;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:IS;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:IS;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:IS;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.d8{font-family:BG;font-weight:800}.d7{font-family:BG;font-weight:700}.d5{font-family:BG;font-weight:500}
.b4{font-family:IS;font-weight:400}.b5{font-family:IS;font-weight:500}.b6{font-family:IS;font-weight:600}
text{font-kerning:normal}
@keyframes flow{to{stroke-dashoffset:-32}}
.flow{stroke-dasharray:4 12;animation:flow 1.4s linear infinite}
.flow-slow{stroke-dasharray:3 9;animation:flow 3s linear infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.85}100%{transform:scale(2.6);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.pulse.d2{animation-delay:1.1s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes blink{50%{opacity:.2}}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes breathe{50%{opacity:.45}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes sweep{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.rise{opacity:1}}
